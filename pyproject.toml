[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "genice3_plumber/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["genice3_plumber"]

[project]
dynamic = ["version"]
name = "genice3-plumber"
description = "OpenSCAD pipework exporter plugin for GenIce3."
requires-python = ">=3.11,<3.14"
dependencies = [
    "genice3>=3.0a3",
    "numpy>=2.0",
]

[project.entry-points."genice3_exporter"]
plumber = "genice3_plumber.exporter.plumber"

[project.urls]
Homepage = "https://github.com/genice-dev/genice3-plumber"

[tool.genice.urls]
repository = "https://github.com/genice-dev/GenIce3"
logo = "https://raw.githubusercontent.com/vitroid/GenIce/develop/logo/genice-v0.png"

# poetry self add poetry-version-plugin
[tool.poetry-version-plugin]
source = "init"

[tool.poetry]
name = "genice3-plumber"
version = "0.0.0"
description = "OpenSCAD pipework exporter plugin for GenIce3."
authors = ["vitroid <vitroid@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
genice3 = "^3.0.a0"
numpy = "^2.0"

[tool.poetry.group.dev.dependencies]
jinja2 = "^3.1.3"
toml = "^0.10.2"

[tool.poetry.plugins.genice3_exporter]
plumber = "genice3_plumber.exporter.plumber"
